<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veera AI — quiz &amp; paywall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{
--bg:#FFFFFF;--surface:#FFFFFF;--fill:#F5F6F9;--line:#E6E8EF;--line-soft:#ECEEF3;
--ink:#111322;--ink-2:#4A4F63;--ink-dis:#6B7083;
--accent:#3B82F6;--accent-2:#8B5CF6;--accent-icon:#2E6BF0;--accent-tint:#EEF4FF;--accent-tint-2:#F3EFFF;
--success:#12B76A;--success-bg:#F0FDF6;--success-line:#A6F0C8;
--holo:conic-gradient(from 0deg,#3B82F6,#8B5CF6,#F0ABFC,#67E8F9,#A5B4FC,#3B82F6);
--fd:Manrope,Inter,'Noto Sans',sans-serif;--ft:Inter,'Noto Sans',system-ui,sans-serif;
--r-sm:12px;--r-md:16px;--r-btn:18px;--r-lg:24px;
--s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;
--shadow:0 8px 28px rgba(17,19,34,.06);
}
body{margin:0}
a{color:var(--ink)}a:hover{color:var(--accent-icon)}
button{font-family:inherit;cursor:pointer}
*{box-sizing:border-box}
.scr{position:relative;background:var(--bg);color:var(--ink);font-family:var(--ft);display:flex;flex-direction:column;overflow:hidden}
.halo{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.halo i{position:absolute;width:460px;height:460px;left:-170px;top:-150px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.16) 0%,rgba(59,130,246,.10) 35%,rgba(59,130,246,0) 70%);animation:hB 8s cubic-bezier(.45,.05,.55,.95) infinite alternate}
.halo i.c{left:-35px;top:-120px}
@keyframes hB{from{opacity:.75;transform:scale(.95)}to{opacity:1;transform:scale(1.05)}}
.top{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px 8px 8px;min-height:68px}
.icb{width:48px;height:48px;border:1px solid var(--line);background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.icb.ghost{border-color:transparent;background:transparent}
.prog{flex:1;height:6px;background:#EEF0F4;border-radius:3px;overflow:hidden}
.prog b{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.count{font-size:17px;font-weight:500;color:var(--ink-2);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.body{position:relative;flex:1;display:flex;flex-direction:column;gap:18px;padding:8px 20px 0 20px;min-height:0}
.t-display{margin:0;font-family:var(--fd);font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.03em}
.t-title{margin:0;font-family:var(--fd);font-size:22px;line-height:1.25;font-weight:800;letter-spacing:-.02em}
.t-h2{margin:0;font-family:var(--fd);font-size:19px;line-height:1.3;font-weight:800;letter-spacing:-.01em}
.t-phrase{margin:0;font-size:24px;line-height:1.4;font-weight:500;letter-spacing:-.01em}
.t-phrase-s{margin:0;font-size:20px;line-height:1.4;font-weight:500}
.t-body{margin:0;font-size:17px;line-height:1.45}
.t-strong{font-weight:600}
.t-native{margin:0;font-size:16px;line-height:1.4;color:var(--ink-2)}
.t-native-s{margin:0;font-size:15px;line-height:1.4;color:var(--ink-2)}
.t-legal{margin:0;font-size:13px;line-height:1.4;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.dock{position:relative;padding:12px 20px 28px 20px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.dock.sticky{background:linear-gradient(rgba(255,255,255,0),#fff 22%)}
.btn{width:100%;height:56px;border-radius:var(--r-btn);border:0;background:var(--ink);color:#fff;font-family:var(--fd);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn[disabled]{background:#E6E8EF;color:var(--ink-dis);cursor:default}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.lnk{min-height:48px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--ink);font-size:17px;font-weight:500;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--accent)}
.lnk.mute{font-size:15px;color:var(--ink-2);text-decoration:none}
.chip{height:48px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:17px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip svg{color:var(--accent-icon)}
.chip.on{border:2px solid var(--ink);background:var(--accent-tint)}
.chip.sm{height:40px;padding:0 12px;font-size:15px;font-weight:500;border-radius:12px;background:var(--fill);border-color:var(--fill)}
.card{position:relative;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border:1px solid var(--line-soft);box-shadow:var(--shadow);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.card.flat{box-shadow:none}
.card.tint{background:var(--accent-tint-2);border-color:#E4DCFF}
.qm{font-family:var(--fd);font-size:44px;line-height:.6;height:22px;font-weight:800;color:var(--accent-2)}
.opt{width:100%;min-height:64px;display:flex;align-items:center;gap:14px;padding:10px 14px 10px 12px;border:1.5px solid var(--line);border-radius:var(--r-md);background:#fff;text-align:left;color:var(--ink)}
.opt .oi{width:40px;height:40px;border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.opt .ot{display:flex;flex-direction:column;gap:2px;flex:1}
.opt .en{font-size:17px;font-weight:600;line-height:1.3}
.opt .na{font-size:15px;color:var(--ink-2);line-height:1.3}
.opt .ck{width:28px;height:28px;border-radius:14px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;background:#fff}
.opt.multi .ck{border-radius:8px}
.opt.sel{border:2px solid var(--ink);background:var(--accent-tint)}
.opt.sel .ck{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.sel .oi{background:#fff}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);font-size:16px;line-height:1.4;color:var(--ink)}
.note svg{flex:none;margin-top:1px}
.note.tip{background:var(--accent-tint)}
.note.info{background:var(--fill)}
.note.ok{background:var(--success-bg)}
.note.white{background:#fff}
.win{position:relative;overflow:hidden;border-radius:var(--r-lg);border:1.5px solid transparent;background:linear-gradient(var(--success-bg),var(--success-bg)) padding-box,linear-gradient(135deg,var(--success-line),#BFD7FF) border-box;box-shadow:0 12px 30px rgba(18,183,106,.10);padding:20px;display:flex;flex-direction:column;gap:14px}
.okc{width:52px;height:52px;border-radius:26px;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.okc.s{width:28px;height:28px;border-radius:14px}
.okc.m{width:36px;height:36px;border-radius:18px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:20px;padding:5px 14px 5px 5px;font-size:17px;font-weight:600;background:var(--success-bg);border:1.5px solid var(--success-line)}
.bub{max-width:88%;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.bub.ai{align-self:flex-start;background:#fff;border:1px solid var(--line-soft);box-shadow:var(--shadow);border-radius:6px 22px 22px 22px}
.bub.me{align-self:flex-end;background:var(--ink);color:#fff;border-radius:22px 6px 22px 22px}
.btxt{margin:0;font-size:20px;line-height:1.4;font-weight:500}
.blur{filter:blur(6px);user-select:none}
.reveal{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:48px;color:var(--ink)}
.rv{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.tr{border-top:1px solid var(--line-soft);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.tipline{align-self:flex-end;display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px;border-radius:14px;background:var(--accent-tint);border:0;color:var(--ink);font-size:16px}
.dots{display:inline-flex;gap:5px;padding:16px 18px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--ink-2);animation:dt 900ms cubic-bezier(.45,.05,.55,.95) infinite alternate}
.dots i:nth-child(2){animation-delay:150ms}.dots i:nth-child(3){animation-delay:300ms}
@keyframes dt{from{opacity:.25;transform:translateY(0)}to{opacity:1;transform:translateY(-3px)}}
.mic{width:80px;height:80px;border-radius:40px;border:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px var(--accent-tint),0 10px 30px rgba(59,130,246,.28);flex:none}
.mic.sm{width:72px;height:72px;border-radius:36px;box-shadow:0 0 0 6px var(--accent-tint),0 10px 24px rgba(59,130,246,.24)}
.mic.off{background:#E6E8EF;color:var(--ink-dis);box-shadow:none}
.bars{display:flex;align-items:center;gap:4px;height:30px}
.bars i{width:5px;height:26px;border-radius:3px;background:#fff;animation:br 320ms ease-in-out infinite alternate;transform-origin:center}
.bars i:nth-child(2){animation-delay:110ms}.bars i:nth-child(3){animation-delay:50ms}.bars i:nth-child(4){animation-delay:190ms}
@keyframes br{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin 900ms linear infinite}
.mlabel{font-family:var(--fd);font-size:18px;font-weight:700}
.seg{display:flex;background:var(--fill);border-radius:14px;padding:3px}
.seg button{height:42px;padding:0 12px;border:0;border-radius:11px;background:transparent;color:var(--ink-2);font-size:15px;font-weight:600}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(17,19,34,.08)}
.appbar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;min-height:68px}
.appbar .ttl{font-size:17px;font-weight:700}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--fill);font-size:15px;font-weight:600;color:var(--ink-2)}
.tag i{width:8px;height:8px;border-radius:4px;background:var(--accent-2)}
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);background:rgba(255,255,255,.96);padding:6px 8px 20px}
.tab{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--ink-2);font-size:17px;font-weight:500}
.tab .ti{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tab.on{color:var(--ink);font-weight:700}
.tab.on .ti{background:var(--accent-tint)}
.toast{position:absolute;left:16px;right:16px;bottom:104px;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:10px;align-items:center;font-size:17px;font-weight:600;box-shadow:0 12px 30px rgba(17,19,34,.25);animation:rise 380ms cubic-bezier(.2,.9,.3,1) both}
.sk{background:linear-gradient(90deg,#EFF1F5 25%,#F8F9FB 50%,#EFF1F5 75%);background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:10px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:17px;font-weight:600}
.inp{height:56px;border:1.5px solid var(--line);border-radius:var(--r-md);padding:0 16px;font-family:var(--ft);font-size:18px;color:var(--ink);background:#fff;width:100%}
.inp.focus{border:2px solid var(--ink);box-shadow:0 0 0 4px var(--accent-tint)}
textarea.inp{height:96px;padding:14px 16px;resize:none;line-height:1.4}
.plan-row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 4px;border:0;background:none;width:100%;text-align:left;color:var(--ink);border-top:1px solid var(--line-soft)}
.plan-row:first-child{border-top:0}
.st{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.st.done{background:var(--success);color:#fff}
.st.next{background:var(--ink);color:#fff}
.st.open{border:1.5px solid var(--line);color:var(--ink-2)}
.week{background:#fff;border:1px solid var(--line-soft);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;font-size:15px;font-weight:600;background:var(--accent-tint);color:var(--ink)}
.badge.goal{background:var(--accent-tint-2)}
.cb{width:28px;height:28px;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.cb.off{background:#fff;border:1.5px solid var(--line);color:transparent}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;color:var(--ink-2)}
.day b{width:32px;height:32px;border-radius:16px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent}
.day.d b{background:var(--success);border-color:var(--success);color:#fff}
.day.t b{border:2px solid var(--ink)}
.plan-opt{width:100%;border:1.5px solid var(--line);border-radius:20px;background:#fff;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;text-align:left;color:var(--ink)}
.plan-opt.sel{border:2px solid var(--ink);background:var(--accent-tint)}
.radio{width:24px;height:24px;border-radius:12px;border:2px solid var(--line);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
.plan-opt.sel .radio{border-color:var(--ink)}
.plan-opt.sel .radio::after{content:'';width:12px;height:12px;border-radius:6px;background:var(--ink)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:8px 0;border-top:1px solid var(--line-soft)}
.pend{opacity:.35}
.rise{animation:rise 380ms cubic-bezier(.2,.9,.3,1) both}
.pop{animation:pop 340ms cubic-bezier(.3,1.6,.6,1) 120ms both}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.4) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
/* Veera orb */
@keyframes bA{from{border-radius:48% 52% 53% 47%/49% 47% 53% 51%}to{border-radius:53% 47% 47% 53%/52% 53% 47% 48%}}
@keyframes bB{from{border-radius:52% 48% 47% 53%/48% 52% 48% 52%}to{border-radius:47% 53% 53% 47%/52% 48% 52% 48%}}
@keyframes bGlow{from{transform:scale(.97);opacity:.22}to{transform:scale(1.05);opacity:.36}}
@keyframes lMorph{0%{border-radius:50%;transform:rotate(0) scale(1)}25%{border-radius:56% 44% 52% 48%/46% 55% 45% 54%;transform:rotate(90deg) scale(1.04)}50%{border-radius:46% 54% 44% 56%/54% 46% 56% 44%;transform:rotate(180deg) scale(.97)}75%{border-radius:53% 47% 56% 44%/48% 53% 47% 52%;transform:rotate(270deg) scale(1.03)}100%{border-radius:50%;transform:rotate(360deg) scale(1)}}
@keyframes lSway{0%{transform:translate(0,0)}25%{transform:translate(1.5px,-1.5px)}50%{transform:translate(0,1.5px)}75%{transform:translate(-1.5px,-1px)}100%{transform:translate(0,0)}}
@keyframes lPulse{from{opacity:.35;transform:scale(1)}to{opacity:.6;transform:scale(1.08)}}
.orb{--o:76px;position:relative;width:var(--o);height:var(--o);flex:none;transition:transform 700ms cubic-bezier(.4,0,.2,1)}
.orb.s28{--o:28px}.orb.s40{--o:40px}.orb.s56{--o:56px}.orb.s120{--o:120px}
.orb .sw{position:absolute;inset:0;animation:lSway 4s cubic-bezier(.45,.05,.55,.95) infinite}
.orb .glow{position:absolute;inset:calc(var(--o) * -0.09);border-radius:50%;background:conic-gradient(from 0deg,#3B82F6,#8B5CF6,#67E8F9,#F0ABFC,#A5B4FC,#3B82F6);filter:blur(calc(var(--o) * 0.18));animation:bB 9s cubic-bezier(.45,.05,.55,.95) infinite alternate,spinR 18s linear infinite,bGlow 6s cubic-bezier(.45,.05,.55,.95) infinite alternate}
.orb .core{position:absolute;inset:0;border-radius:50%;background:var(--holo);filter:blur(calc(var(--o) * 0.09));animation:bA 6s cubic-bezier(.45,.05,.55,.95) infinite alternate,spin 12s linear infinite}
.orb .lsw{position:absolute;inset:2px;border-radius:50%;background:conic-gradient(from 90deg,#67E8F9,#3B82F6,#F0ABFC,#8B5CF6,#67E8F9);filter:blur(calc(var(--o) * 0.08));mix-blend-mode:screen;opacity:0;transition:opacity 700ms ease;animation:lMorph 3.2s linear infinite}
.orb .mint{background:conic-gradient(from 0deg,#12B76A,#67E8F9,#A6F0C8,#3B82F6,#12B76A);opacity:0;transition:opacity 700ms ease}
.orb .gloss{position:absolute;inset:0;border-radius:50%;filter:blur(2px);background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8),rgba(255,255,255,0) 44%);box-shadow:inset 0 0 calc(var(--o) * 0.24) rgba(255,255,255,.5);animation:bA 6s cubic-bezier(.45,.05,.55,.95) infinite alternate}
.orb .lh{position:absolute;inset:calc(var(--o) * -0.1);border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.28),rgba(139,92,246,.12) 45%,rgba(139,92,246,0) 70%);opacity:0;transition:opacity 700ms ease;animation:lPulse 1.6s cubic-bezier(.45,.05,.55,.95) infinite alternate}
.orb.speak{transform:scale(1.07)}
.orb.speak .glow{filter:blur(calc(var(--o) * 0.22))}
.orb.listen{transform:scale(.97)}
.orb.listen .lsw{opacity:.85}
.orb.listen .lh{opacity:1}
.orb.think .lh{opacity:.5}
.orb.happy{transform:scale(1.05)}
.orb.happy .mint{opacity:.9}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

html,body{height:100%}
body{background:#F5F6F9;display:flex;justify-content:center;align-items:center;font-family:var(--ft)}
#app{position:relative;width:100%;max-width:430px;height:100dvh;max-height:932px;background:#fff;overflow:hidden}
@media (min-width:600px){#app{height:min(860px,calc(100dvh - 32px));max-width:390px;border-radius:36px;box-shadow:0 30px 80px rgba(17,19,34,.18)}}
.scr{position:absolute;inset:0}
.body{min-height:0}
.body.scroll{overflow-y:auto;padding-bottom:16px}
.muted{color:var(--ink-2)}
.t-body.muted{color:var(--ink-2)}
.uarow{position:relative;display:flex;justify-content:flex-end;padding:0 16px 2px;margin-top:-8px}
.uabtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:15px;font-weight:600}
.uabtn.on{border-color:var(--ink);background:var(--accent-tint)}
.ua{animation:rise 300ms ease-out both}
.opts{gap:10px}
.brand{position:relative;display:flex;align-items:center;gap:8px;padding:16px 20px 4px}
.brand b{font-family:var(--fd);font-size:18px;font-weight:800}
.hero{position:relative;height:236px;border-radius:24px;background:linear-gradient(160deg,#F3EFFF,#EEF4FF 55%,#FFFFFF);overflow:hidden;flex:none}
.hero-orb{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%)}
.hero .sup{position:absolute;left:14px;top:14px;max-width:72%;gap:2px;padding:10px 14px}
.hero .you{position:absolute;right:14px;bottom:16px;padding:10px 14px}
.hero .btxt{font-size:17px}
.bignum{font-family:var(--fd);font-size:68px;font-weight:800;letter-spacing:-.04em;line-height:1;background:linear-gradient(90deg,#3B82F6,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 420ms ease-out both}
.illo{width:100%;height:auto;max-height:170px;flex:none}
